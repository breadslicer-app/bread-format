[package]
name = "bread-format"
version = "0.5.0"
edition.workspace = true
license.workspace = true
authors = ["SynrgStudio"]
description = "Reads and writes .bread files: tiny, lossless meshes and scenes, with room for slicer data such as editable supports."
categories = ["encoding"]
keywords = ["3d", "mesh", "lossless", "file-format", "slicer"]
repository.workspace = true
homepage = "https://bread.synrgs.tech"
documentation = "https://docs.rs/bread-format"
readme = "README.md"
# What goes to crates.io. The tests stay in the repository: they read the
# conformance files at its root.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[lints]
workspace = true

[dependencies]
crc32fast = "1.5.0"
meshopt = "0.7"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
sha2 = "0.10"
