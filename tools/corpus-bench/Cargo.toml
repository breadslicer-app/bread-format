[package]
name = "corpus-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors = ["SynrgStudio"]
description = "Measures .bread on a folder of binary STL files: sizes, times, and that every corner comes back."
repository.workspace = true
publish = false

[dependencies]
bread-format = { path = "../../crates/bread-format" }
flate2 = "1.1.11"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }

[lints]
workspace = true
