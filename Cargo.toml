[workspace]
resolver = "3"
members = ["crates/bread-format", "crates/bread-wasm"]

[workspace.package]
edition    = "2024"
license    = "Apache-2.0"
repository = "https://github.com/breadslicer-app/bread-format"

[workspace.lints.rust]
unsafe_code = "forbid"

# Block non-ASCII and visually confusable identifiers (homoglyph and
# trojan-source identifier attacks). The bidi text-flow control lints
# (text_direction_codepoint_in_literal / _in_comment) are already
# deny-by-default in rustc.
non_ascii_idents         = "deny"
confusable_idents        = "deny"
mixed_script_confusables = "deny"
uncommon_codepoints      = "deny"

missing_debug_implementations = "deny"
unreachable_pub               = "deny"
unused_qualifications         = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The WebAssembly module of crates/bread-wasm, built with `--profile wasm` so
# the release profile stays as it is. Optimized for speed: decoding a MESH v2
# chunk of 2 M triangles takes about 200 ms at level 2 and about 500 ms at
# "z", for 6 KB more to download (brotli).
[profile.wasm]
inherits      = "release"
opt-level     = 2
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
