# What is true about the .bread format and can be published. Every number
# the page at bread.synrgs.tech shows comes from here, by its key.
# Sizes are decimal: 1 MB = 1,000,000 bytes, 1 KB = 1,000 bytes.

[project]
name = ".bread"
expansion = "Bit-exact Representation of Editable Assembly Data"
extension = ".bread"
magic = "42 52 45 41 44 00 0D 0A"
container_version = 1
chunk_versions = { SCNE = 1, MESH = 2, THMB = 1, PROJ = 1, SUPP = 2, HOLW = 2, SPRV = 1, SURF = 1 }
mesh_versions_read = [1, 2]
spec_status = "frozen"          # version 1, tag spec-v1
license = "Apache-2.0"
reference_implementation = "bread-format, a Rust crate, also built to WebAssembly for JavaScript"
version = "0.3.0"               # of the reference implementation
released = 2026-11-11
earlier_versions = [{ version = "0.2.0", released = 2026-11-11 }, { version = "0.1.0", released = 2026-10-30 }]
units = "millimetres; right-handed axes, Z up, XY is the build plate"
# No repo links: the repository is private (rules.md).

